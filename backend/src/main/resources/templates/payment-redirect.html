<!DOCTYPE html>
<html>
<head>
    <title>Redirecting...</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: -apple-system, blinkmacsystemfont, 'Segoe UI', roboto, oxygen, ubuntu, cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f7f7f7; color: #333; }
        .container { text-align: center; padding: 20px; max-width: 90%; }
        p { color: #666; margin-bottom: 20px; font-size: 1rem; }
        .btn { display: inline-block; padding: 10px 20px; background-color: #007AFF; color: white; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 0.9rem; border: none; cursor: pointer; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #007AFF; border-radius: 50%; width: 35px; height: 35px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <script>
        window.onload = function() {
            setTimeout(function() {
                window.location.href = "{{finalUrl}}";
            }, 300); // Redirect nhanh sau 0.3s
        };
    </script>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <p>Đang quay trở lại ứng dụng...</p>
        <a href="{{finalUrl}}" class="btn">Mở ứng dụng</a>
    </div>
</body>
</html>
